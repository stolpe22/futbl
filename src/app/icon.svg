<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Onça do Futebol da Missão (desenho original): de frente, brava, rosnando -->
  <rect width="64" height="64" rx="14" fill="#1a160e"/>
  <!-- orelhas para trás, pontudas -->
  <path d="M8 22 L12 6 L25 14 Z" fill="#fdb72d"/>
  <path d="M56 22 L52 6 L39 14 Z" fill="#fdb72d"/>
  <path d="M12 18 L13.5 10.5 L20 14.5 Z" fill="#1a160e"/>
  <path d="M52 18 L50.5 10.5 L44 14.5 Z" fill="#1a160e"/>
  <!-- cabeça angulosa, queixo forte -->
  <path d="M32 11 L45 13 L55 23 L56 36 L49 48 L40 56 L32 58 L24 56 L15 48 L8 36 L9 23 L19 13 Z" fill="#fdb72d"/>
  <!-- rosetas -->
  <g fill="none" stroke="#1a160e" stroke-width="1.8">
    <path d="M30 15.5 a2.4 2.4 0 1 1 4 0"/>
    <circle cx="22" cy="19" r="1.9"/>
    <circle cx="42" cy="19" r="1.9"/>
    <circle cx="13" cy="31" r="2"/>
    <circle cx="51" cy="31" r="2"/>
  </g>
  <g fill="#1a160e">
    <circle cx="26.5" cy="15" r="1"/>
    <circle cx="37.5" cy="15" r="1"/>
    <circle cx="12.5" cy="38" r="1.3"/>
    <circle cx="51.5" cy="38" r="1.3"/>
    <circle cx="17" cy="44" r="1.1"/>
    <circle cx="47" cy="44" r="1.1"/>
  </g>
  <!-- sobrancelhas franzidas em V -->
  <path d="M15 24 L29 29.5 L28 31.5 L15 26.5 Z" fill="#1a160e"/>
  <path d="M49 24 L35 29.5 L36 31.5 L49 26.5 Z" fill="#1a160e"/>
  <!-- olhos estreitos, pupila em fenda -->
  <path d="M17 29 L28 32.5 L25 35 L18.5 33 Z" fill="#fff3c4"/>
  <path d="M47 29 L36 32.5 L39 35 L45.5 33 Z" fill="#fff3c4"/>
  <rect x="22.3" y="30.6" width="1.6" height="4" rx="0.8" fill="#1a160e"/>
  <rect x="40.1" y="30.6" width="1.6" height="4" rx="0.8" fill="#1a160e"/>
  <!-- rugas do focinho -->
  <path d="M29 34.5 L27 38 M35 34.5 L37 38" stroke="#1a160e" stroke-width="1.4" stroke-linecap="round"/>
  <!-- focinho e nariz -->
  <path d="M23 42 L32 39 L41 42 L43 48 L32 52 L21 48 Z" fill="#faf7f0"/>
  <path d="M27.5 37.5 L36.5 37.5 L32 42.5 Z" fill="#1a160e"/>
  <!-- boca rosnando com presas -->
  <path d="M24 46 L32 44 L40 46 L37 51 L32 52.5 L27 51 Z" fill="#7a1010"/>
  <path d="M26 45.5 L27.5 50.5 L29 45 Z" fill="#faf7f0"/>
  <path d="M38 45.5 L36.5 50.5 L35 45 Z" fill="#faf7f0"/>
  <path d="M24 46 L32 44 L40 46" stroke="#1a160e" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
</svg>
